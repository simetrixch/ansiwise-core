# Every check this package makes, and the file that carries it.
#
# WHY THIS FILE EXISTS. `dart test` discovers whatever is on disk and reports whether any of it
# failed. Delete a check file and nothing fails: the check is simply not there, and the run prints
# that every check is green. It is worse than a missing test, because a check and its counter-probe
# live in the same file — the thing that would have noticed goes with the thing it was watching.
#
# So the suite does not ask the disk what it checks. It is told here, and
# test/checks/declared_checks_test.dart holds the disk against this file, naming whatever vanished.
#
# FORMAT. `<check>: <file, relative to this file>`, one per line, the reason on the comment line
# directly above it. It is read line by line and the reader imports nothing but dart:io, because the
# same reading is done by gate programs that have to start on a fresh clone where no package has been
# resolved.
#
# ADDING A CHECK MEANS ADDING A LINE. A check file that is not declared here is reported too: an
# undeclared check is one nobody agreed to, and it is how a suite grows a file that judges nothing.

# The analyzer and the formatter find nothing to change in this package tree. That they are
# STARTED correctly is not asked here: the gate is package:ansiwise_checks_gate now, and its own
# suite is what judges one planted tree twice, with the flags and without.
tree-analysis: test/checks/analysis_test.dart
# This framework names no platform, anywhere, with no exempt path — the line that keeps a plugin's
# knowledge out of the thing that composes plugins.
api-purity: test/checks/api_purity_test.dart
# Every Dart directive spells the path it names byte for byte, so a build for Linux opens what a
# build for Windows opened.
case-sensitivity: test/checks/case_sensitivity_test.dart
# This package is told what it checks, and holds the disk against it.
declared-checks: test/checks/declared_checks_test.dart
# Nothing outside infrastructure/ reaches the machine directly, which is what makes a dry run a
# guarantee rather than a promise.
exec-confinement: test/checks/exec_confinement_test.dart
# The framework reaches no package that is not on pub.dev, so nothing of ours can become part of it
# by the back door.
framework-independence: test/checks/framework_independence_test.dart
# No import points outward, so a layer cannot quietly depend on the one above it.
layering: test/checks/layering_test.dart
# The abolished words appear in no name.
naming: test/checks/naming_test.dart
# THERE IS NO RELEASE CHECK, BECAUSE THERE IS NO RELEASE. This package is a part of ansiwise-cli
# and is released by nobody: there is no tag to compose, no channel to admit a stage, and no
# release page to mark. Releasing happens once, in the product's own release/release.sh.
# Every dependency this package resolves out of git names a release tag and never a branch. Only a
# DEV dependency stands here, so what this keeps is not a consumer — a consumer never resolves one —
# but the gate itself: the tree at a release tag IS the release, and a dev dependency following a
# branch means re-running that gate later judges a tree nobody released.
dependency-pins: test/checks/dependency_pins_test.dart
