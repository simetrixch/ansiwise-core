# Runs a declared program of steps against a machine — three modes, a record, undo, and plugins.
#
# It knows nothing about what is being deployed. No Kubernetes, no cloud, no product: a plugin
# brings all of that, and a check turns the tree red if any of it appears here.
name: ansiwise_core
description: A typed step engine with three modes, a run record, and a registry of steps.
publish_to: none
version: 0.7.3

environment:
  sdk: ^3.12.0

dependencies:
  # Program files are YAML. Data only — the loader rejects anything that would let YAML compute.
  yaml: ^3.1.3
  path: ^1.9.1

  meta: ^1.19.0
  collection: ^1.19.1
  # The gate's fingerprint is a digest of the resolved input, so a dry run and the real run that
  # follows it can be compared without storing the input itself.
  crypto: ^3.0.7

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  # The gate's own audits, in a package beside this one because they walk files and the shipped
  # library may not reach dart:io outside infrastructure/. A DEV dependency: it is never compiled
  # into anything and travels to no consumer, and framework-independence allows it because a sibling
  # in this repository is not something below the framework.
  # THE TREE HALF ONLY, and that is what keeps framework-independence absolute rather than
  # qualified. This package depends on nothing of ours: it reads files. The half that drives a
  # registry depends on THIS framework, so it stands above it and the framework never reaches it.
  ansiwise_checks_tree:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: 0.7.4-stable-20260901191607
      path: tree
